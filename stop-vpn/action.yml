name: Stop WireGuard
description: Stop WireGuard VPN
inputs:
  interface:
    description: "Network interface to use"
    required: false
    default: "wg0"
  debug:
    description: "Toggle debug mode on/off"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Stop WireGuard
      shell: bash
      run: |
        sudo wg-quick down "${{ inputs.interface }}"

        echo "=== WireGuard Stopped ==="
