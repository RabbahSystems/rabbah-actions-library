name: Install WireGuard
description: Setup WireGuard to get access to internal services
inputs:
  config:
    description: "Base64 Peer configuration file"
    required: true
  interface:
    description: "Network interface to use"
    required: false
    default: "wg0"
  debug:
    description: "Toggle debug mode on/off"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install WireGuard
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y wireguard wireguard-tools

    - name: Create Peer Configuration File
      shell: bash
      run: |
        sudo mkdir -p /etc/wireguard
        sudo chmod 700 /etc/wireguard

        echo "${{ inputs.config }}" | base64 -d > "$HOME/${{ inputs.interface }}.conf"
        sudo mv "$HOME/${{ inputs.interface }}.conf" /etc/wireguard/${{ inputs.interface }}.conf
        sudo chmod 600 "/etc/wireguard/${{ inputs.interface }}.conf"

    - name: Start WireGuard
      shell: bash
      run: |
        sudo wg-quick up "${{ inputs.interface }}"
        # Set MTU for default packet sizing, without this SSH connection freezes
        sudo ip link set dev wg0 mtu 1280

    - name: Display connection info
      shell: bash
      run: |
        echo "=== WireGuard Status ==="
        sudo wg show 
        echo ""
        echo "=== Interface Info ==="
        ip addr show ${{ inputs.interface }}
        echo ""
        echo "=== Routes ==="
        ip route show || echo "No specific routes"
        echo ""
        echo "=== Ping WireGuard DNS ==="
        ping -c 3 10.13.13.1 || true

    - name: Print Peer Configuration File
      shell: bash
      if: inputs.debug == 'true'
      run: |
        sudo cat "/etc/wireguard/${{ inputs.interface }}.conf"

        echo "=== Ping Gateway ==="
        ping -c 4 gateway.rabbah.sa
        echo "=== Ping DNS ==="
        ping -c 4 10.13.13.1
        echo "=== Ping Internal Servers ==="
        ping -c 4 10.1.0.2
        echo "=== Ping Automation Machine ==="
        ping -c 4 10.1.1.2
